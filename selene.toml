# The game code is Roblox code. `roblox.yml` is generated by
# `selene generate-roblox-std` and is gitignored, since it is derived, large,
# and regenerated by `lune run lint`.
std = "roblox"

# Specs and the Lune scripts run on Lune, not in Roblox, so the Roblox standard
# library does not describe them. They are checked by running them.
exclude = ["**/*.spec.luau", ".lune/**"]
